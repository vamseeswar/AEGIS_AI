[pytest]
minversion = 7.0
addopts = -ra -q --strict-markers
testpaths = tests
python_files = test_*.py
python_functions = test_*
asyncio_mode = strict
markers =
    unit: Unit tests for individual components and algorithms
    integration: End-to-end integration workflows across multiple subsystems
    security: Adversarial security penetration and fuzzing tests
